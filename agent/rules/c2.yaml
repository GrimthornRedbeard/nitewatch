name: c2
# Command-and-control detection: programs on this PC talking to infrastructure
# that controls malware, or behaving the way remote-controlled software behaves.
#
# Writing guidance for narratives and playbooks: the reader is a worried person,
# not an analyst. Say what happened, why it matters, and what to do. Keep jargon
# out of the narrative — the evidence table carries the technical detail.
rules:
  - id: c2-feed-flagged-connection
    area: c2
    severity: critical
    detector: connection-intel-hit
    title: "{{.ProcessName}} is contacting a server known to control malware"
    narrative: |
      {{.ProcessName}} connected to {{.Destination}}. That server is
      {{.FeedReason}}.

      Programs contact servers like this when someone else is controlling them
      remotely — which usually means this program is malicious, or a legitimate
      program has been tampered with.
    playbook:
      - "If you did not expect this, disconnect from the internet now (turn off Wi-Fi or unplug the network cable)."
      - "Write down the program name: {{.ImagePath}}"
      - "Run a full scan with Microsoft Defender (Start → Windows Security → Virus & threat protection → Scan options → Full scan)."
      - "Do not enter passwords on this device until the scan is clean."
      - "If this is a work computer, tell your IT team before doing anything else."

  - id: c2-raw-ip-no-dns
    area: c2
    # Medium, not high. Even with the unsigned requirement this is a prompt to
    # look, not a finding — and high severity interrupts, which this does not
    # deserve.
    severity: medium
    detector: raw-ip-no-dns
    title: "{{.ProcessName}} connected to a numeric address without looking it up"
    narrative: |
      {{.ProcessName}} connected straight to {{.RemoteIP}}{{if .Owner}}, a network
      operated by {{.Owner}},{{end}} with no name lookup seen first — and Windows
      cannot confirm who published this program.

      Either part alone would be unremarkable. Together they are worth a look:
      software with no publisher, reaching an address it never asked for by name.
    playbook:
      - "Do you recognise {{.ProcessName}}? If not, look it up before doing anything else."
      - "Check who owns the address it contacted: {{.RemoteIP}}{{if .Owner}} (currently registered to {{.Owner}}){{end}}."
      - "If you do not recognise the program, run a full Microsoft Defender scan."
      - "If you do recognise it and expected this, you can safely allow it."

  - id: c2-unsigned-first-contact
    area: c2
    severity: medium
    detector: unsigned-outbound
    title: "{{.ProcessName}} has no publisher signature and just contacted a new server"
    narrative: |
      {{.ProcessName}} contacted {{.Destination}} for the first time. This
      program is not digitally signed, which means Windows cannot confirm who
      wrote it or that it has not been altered.

      Plenty of small and homemade tools are unsigned, so this on its own is not
      proof of anything — but unsigned software reaching out to the internet is
      worth a second look.
    playbook:
      - "Do you recognise {{.ProcessName}} and expect it to use the internet?"
      - "If not, find where it came from: {{.ImagePath}}"
      - "If you did not install it deliberately, run a full Microsoft Defender scan."

  - id: c2-foreign-first-contact
    area: c2
    severity: medium
    detector: foreign-first-contact
    title: "{{.ProcessName}} contacted a server in {{.Country}} for the first time"
    narrative: |
      {{.ProcessName}} connected to {{.Destination}}, on a network registered in
      {{.Country}}{{if .Owner}} and operated by {{.Owner}}{{end}}.

      Traffic to this country is not wrong by itself — many ordinary services are
      hosted internationally. It is flagged because it is the first time this
      program has gone there, and unexpected foreign connections are worth a
      glance.
    playbook:
      - "Does {{.ProcessName}} have a reason to talk to a server in {{.Country}}?"
      - "If it is a browser, a game, or a messaging app, this is probably normal."
      - "If it is something you do not recognise, run a full Microsoft Defender scan."
