name: credentials
# Sensitive-file access: something reading secrets it does not own.
#
# The judgement: the PATH alone means nothing. Chrome reading Chrome's password
# store is Chrome working. Another program reading it is an information stealer,
# which is the single most common consumer malware family today. The detector
# therefore compares the reader against the owner, and stays silent when they
# match.
rules:
  - id: credential-theft
    area: credentials
    severity: critical
    detector: credential-access-by-stranger
    title: "{{.ProcessName}} is reading {{.SecretDescription}}"
    narrative: |
      {{.ProcessName}} opened {{.SecretPath}}.

      That file holds {{.SecretDescription}}. {{.OwnerNote}}

      Programs that collect saved passwords, session cookies and wallet files
      are called information stealers, and this is exactly how they behave.
    playbook:
      - "If you do not recognise {{.ProcessName}}, stop it using the button below."
      - "Assume the passwords in that file may be known to someone else."
      - "Change your important passwords from a DIFFERENT device — not this one — starting with email and banking."
      - "Turn on two-factor authentication anywhere you can."
      - "Run a full Microsoft Defender scan."
      - "Program: {{.ImagePath}}"
