name: credentials
# Sensitive-file access: something reading secrets it does not own.
#
# The judgement: the PATH alone means nothing. Chrome reading Chrome's password
# store is Chrome working. Another program reading it is an information stealer,
# which is the single most common consumer malware family today. The detector
# therefore compares the reader against the owner, and stays silent when they
# match.
rules:
  - id: credential-theft
    area: credentials
    severity: critical
    detector: credential-access-by-stranger
    title: "{{.ProcessName}} is reading {{.SecretDescription}}"
    narrative: |
      {{.ProcessName}} opened {{.SecretPath}}.

      That file holds {{.SecretDescription}}. {{.OwnerNote}}

      Programs that collect saved passwords, session cookies and wallet files
      are called information stealers, and this is exactly how they behave.
    playbook:
      - "If you do not recognise {{.ProcessName}}, stop it using the button below."
      - "Assume the passwords in that file may be known to someone else."
      - "Change your important passwords from a DIFFERENT device — not this one — starting with email and banking."
      - "Turn on two-factor authentication anywhere you can."
      - "Run a full Microsoft Defender scan."

  # The same read, when the causal graph shows the key was actually USED.
  #
  # A 16-day soak on a working machine produced exactly one alert: an AI
  # desktop app reading an SSH private key. It was correct — the file really
  # was read — and it was the user's own tooling connecting to their dev box,
  # 136 times, with a key whose filename says so.
  #
  # The graph was holding the explanation the whole time and the alert did not
  # use it. Telling somebody their key was stolen when it was their own
  # terminal is how a product gets uninstalled; saying nothing at all is how
  # it misses the real thing. So: still reported, still specific, without the
  # information-stealer framing and without the 3am severity.
  - id: ssh-key-in-use
    area: credentials
    severity: low
    detector: ssh-key-read-then-used
    title: "{{.ProcessName}} used your SSH key to connect to {{.SSHPeer}}"
    narrative: |
      {{.ProcessName}} read {{.SecretDescription}}, then connected to
      {{.SSHPeer}}{{if gt .SSHPeerCount 1}} and {{.SSHPeerCount}} hosts in total{{end}} over SSH.

      That is what an SSH client does, so on its own this is not a problem —
      a terminal, a Git client or a remote-development tool reading your key
      and using it is the key working as intended.

      It is here because reading a private key is worth knowing about either
      way. The question is only whether you expected {{.ProcessName}} to be
      making SSH connections.
    playbook:
      - "If you recognise {{.ProcessName}} and expected it to connect to {{.SSHPeer}}, nothing needs doing."
      - "If you did not, that is the part worth looking at — not the file read."
      - "A key used from a program you do not recognise should be replaced, and the host it reached checked."
