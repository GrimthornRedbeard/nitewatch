<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NiteWatch — Who's Talking?</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131824; --line: #232a3a; --fg: #e6e9f0;
    --muted: #8a93a6; --accent: #4da3ff; --new: #ffcf5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 18px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .3px; }
  header .tag { color: var(--muted); font-size: 13px; }
  .wrap { padding: 22px; max-width: 1100px; margin: 0 auto; }
  .cards { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; min-width: 150px; }
  .card .n { font-size: 24px; font-weight: 600; }
  .card .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .controls { margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=search] { flex: 1 1 320px; padding: 10px 12px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; color: var(--fg); font-size: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--panel); color: var(--muted); border: 0; padding: 10px 14px;
    font-size: 13px; cursor: pointer; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: #05121f; font-weight: 600; }
  td.num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  tr:last-child td { border-bottom: none; }
  td.domain { color: var(--accent); }
  td.raw { color: var(--muted); font-style: italic; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .banner { display: none; margin: 0 0 18px; padding: 12px 16px; border-radius: 10px;
    border: 1px solid #6a4a00; background: #2a2000; color: var(--new); }
  .banner.show { display: block; }
  .banner b { color: #fff; }
</style>
</head>
<body>
<header>
  <h1>NiteWatch</h1>
  <span class="tag">Who's talking? — outbound connection ledger</span>
</header>
<div class="wrap">
  <div id="banner" class="banner"></div>
  <div class="cards">
    <div class="card"><div class="n" id="c-total">–</div><div class="l">Connections</div></div>
    <div class="card"><div class="n" id="c-talkers">–</div><div class="l">Processes</div></div>
    <div class="card"><div class="n" id="c-domains">–</div><div class="l">Destinations</div></div>
  </div>
  <div class="controls">
    <input type="search" id="filter" placeholder="Filter by process, domain, or IP…" autocomplete="off">
    <div class="seg" id="ipseg">
      <button data-v="all" class="on">All</button>
      <button data-v="4">IPv4</button>
      <button data-v="6">IPv6</button>
    </div>
  </div>
  <table>
    <thead><tr>
      <th>Last seen</th><th>Process</th><th>Destination</th><th>IP:Port</th>
      <th>Proto</th><th title="Network events collapsed into this connection">Activity</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" hidden>No connections recorded yet.</div>
  <div class="foot">Local only — this page and its data never leave your machine. Auto-refreshes every 5s.</div>
</div>
<script>
  let all = [];
  const $ = (id) => document.getElementById(id);

  function shortImage(p) {
    if (!p) return "(unknown)";
    const parts = p.split(/[\\/]/);
    return parts[parts.length - 1] || p;
  }
  function hostPort(ip, port) {
    if (!ip) return "";
    return (ip.includes(":") ? "[" + ip + "]" : ip) + ":" + (port || 0);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }
  function fmtTime(t) {
    const d = new Date(t);
    return isNaN(d) ? t : d.toLocaleString();
  }
  let ipFilter = "all";

  function visible() {
    const q = $("filter").value.toLowerCase();
    return all.filter(c => {
      if (ipFilter !== "all" && String(c.ipVersion) !== ipFilter) return false;
      if (!q) return true;
      return (c.image && c.image.toLowerCase().includes(q)) ||
             (c.domain && c.domain.toLowerCase().includes(q)) ||
             (c.remoteIP && c.remoteIP.toLowerCase().includes(q));
    });
  }

  function render() {
    const rows = visible();
    const tb = $("rows");
    tb.innerHTML = "";
    for (const c of rows) {
      const tr = document.createElement("tr");
      const dest = c.domain
        ? `<td class="domain" title="${esc(c.domain)}">${esc(c.domain)}</td>`
        : `<td class="raw" title="No DNS name seen for this address">— no name —</td>`;
      tr.innerHTML =
        `<td title="first seen ${esc(fmtTime(c.time))}">${esc(fmtTime(c.lastSeen || c.time))}</td>` +
        `<td title="${esc(c.image)}">${esc(shortImage(c.image))}</td>` +
        dest +
        `<td title="${esc(hostPort(c.remoteIP, c.remotePort))}">${esc(hostPort(c.remoteIP, c.remotePort))}</td>` +
        `<td>${esc(c.proto)}</td>` +
        `<td class="num">${esc(c.events || 1)}</td>`;
      tb.appendChild(tr);
    }
    $("empty").hidden = rows.length > 0;
    $("c-total").textContent = rows.length;
    $("c-talkers").textContent = new Set(rows.map(c => c.image)).size;
    $("c-domains").textContent = new Set(rows.map(c => c.domain || c.remoteIP)).size;
  }

  $("ipseg").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    ipFilter = b.dataset.v;
    for (const el of $("ipseg").children) el.classList.toggle("on", el === b);
    render();
  });
  async function refreshStatus() {
    try {
      const st = await (await fetch("/api/status")).json();
      const b = $("banner");
      if (st.running) { b.className = "banner"; return; }
      b.className = "banner show";
      if (st.source === "live-etw" && !st.elevated) {
        b.innerHTML = "<b>NiteWatch needs Administrator to watch this PC.</b> " +
          "The live sensor (ETW) requires elevation. Close this, right-click " +
          "nitewatch.exe (or run-nitewatch.bat) and choose <b>Run as administrator</b>.";
      } else {
        b.innerHTML = "<b>No live telemetry.</b> " + (st.message || "Sensor is not running.");
      }
    } catch (e) { /* ignore */ }
  }
  async function refresh() {
    try {
      const r = await fetch("/api/connections?limit=1000");
      all = await r.json() || [];
      render();
    } catch (e) { /* keep last view on transient error */ }
    refreshStatus();
  }
  $("filter").addEventListener("input", render);
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
