name: agent
on: { push: {}, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go vet ./...
      - run: go test ./... -race
      - run: GOOS=windows GOARCH=amd64 go build ./...
